name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Privacy guard (no personal data in the repository)
        run: |
          if git ls-files | grep -E '^(input/|data/(sklady\.txt|zawodnicy|wiek|numery|korekty|wyjatki)\.?|dist/ranking-publiczny\.html$)|\.mht$'; then
            echo "Files with personal data must stay local"; exit 1
          fi
          if git grep -nE 'Urodzon[ya]:\s*[0-9]{2}\.[0-9]{2}\.[0-9]{4}|"zawodnik"\s*:' -- ':!.github'; then
            echo "Personal data found in tracked files"; exit 1
          fi

      - name: Ranking tests (teams and league table)
        run: node scripts/test.mjs

      - name: Build page from team data
        run: python scripts/build.py
